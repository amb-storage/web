name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build không cần backend thật: layout có dữ liệu dự phòng, các trang đều render khi request
      API_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Không truyền version: lấy theo "packageManager" trong package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Check ja/en message keys match
        run: |
          node -e '
            const keys = (o, p = "") => Object.entries(o).flatMap(([k, v]) => typeof v === "object" ? keys(v, p + k + ".") : [p + k]);
            const ja = new Set(keys(require("./messages/ja.json")));
            const en = new Set(keys(require("./messages/en.json")));
            const missing = [...[...ja].filter((k) => !en.has(k)).map((k) => "en: " + k), ...[...en].filter((k) => !ja.has(k)).map((k) => "ja: " + k)];
            if (missing.length) { console.error("Missing message keys:\n" + missing.join("\n")); process.exit(1); }
          '
      - run: docker build --build-arg API_BASE_URL="$API_BASE_URL" --tag amb-storage-web:ci .
      - run: git diff --check
